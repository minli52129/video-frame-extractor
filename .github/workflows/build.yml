name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest 运行器已预装 Android SDK($ANDROID_HOME,root 所有,需 sudo)
      # 注意: sudo 会重置 PATH,sdkmanager 必须使用完整路径
      - name: Install Android SDK Platform 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | sudo env "JAVA_HOME=$JAVA_HOME" "$SDKMANAGER" --licenses > /dev/null || true
          sudo env "JAVA_HOME=$JAVA_HOME" "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          # sudo 运行 sdkmanager 会把 ~/.config/.android 变成 root 所有,
          # 导致 AGP 无法写入 debug keystore,这里把属主改回来
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.config/.android" "$HOME/.android" 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-frame-extractor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
